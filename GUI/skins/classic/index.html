<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>经典卡片</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card" data-tauri-drag-region="deep">
    <div class="status-row">
      <span id="status-dot" class="dot"></span>
      <span id="status-text">连接中…</span>
      <span id="updated" class="updated"></span>
    </div>
    <div class="stats">
      <div class="stat">
        <div class="stat-label">智能体</div>
        <div class="stat-value"><span id="total">--</span></div>
      </div>
      <div class="stat">
        <div class="stat-label">工作中</div>
        <div class="stat-value working"><span id="working">--</span></div>
      </div>
    </div>
  </div>
  <script src="main.js"></script>
</body>
</html>
